# 复制为 configs/app.toml 后按环境修改。
# 敏感项也可通过环境变量覆盖：MYSQL_DSN / ADMIN_USERNAME / ADMIN_PASSWORD / SESSION_SECRET / SERVER_ADDR

[server]
addr = ":8080"

[mysql]
# 示例 DSN（请改成真实库）
dsn = "qw:qw_pass@tcp(127.0.0.1:3306)/qiwei_zhushou?parseTime=true&charset=utf8mb4&loc=Local"

[admin]
username = "admin"
password = "change-me"

[session]
cookie_name = "qw_admin_session"
# 至少 16 字符；生产请用强随机串
secret = "change-me-to-a-long-secret"
ttl_seconds = 86400
cookie_secure = false

[static]
dir = "web/dist"

# 企业微信自建应用（可选；本地开发可先用假网关）
# 也可用环境变量：WECOM_CORP_ID / WECOM_CORP_SECRET / WECOM_TOKEN / WECOM_ENCODING_AES_KEY / WECOM_GROUP_WEBHOOK
[wecom]
corp_id = ""
corp_secret = ""
agent_id = 0
token = ""
encoding_aes_key = ""
callback_path = "/wecom/callback"
# true：注入 FakeGateway（仅本地无密钥时临时自测；单测直接 new FakeGateway，不依赖此项）
# 真联调必须 false，并配置 corp_secret
use_fake_gateway = false
# 客户群发消息：群机器人 Webhook（外部客户群实用通道；自建应用无法直接往客户群自由发言）
group_webhook = ""
