<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企微交付助手</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
      --accent-hover: #0d9488;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 420px;
      margin: 12vh auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 650;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .9rem;
    }
    label {
      display: block;
      font-size: .85rem;
      margin: 0 0 6px;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      margin-top: 10px;
    }
    .err {
      color: var(--danger);
      font-size: .9rem;
      min-height: 1.2em;
      margin: 0 0 10px;
    }
    .ok {
      color: var(--accent);
      font-size: .95rem;
    }
    .hidden { display: none; }
    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .appbar strong { font-weight: 650; }
    .panel {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .panel .card { padding: 20px; }
    code {
      background: #f3f4f6;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: .9em;
    }
  </style>
</head>
<body>
  <div id="login-view" class="wrap">
    <div class="card">
      <h1>企微交付助手</h1>
      <p class="sub">管理员登录</p>
      <p id="login-err" class="err"></p>
      <form id="login-form">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">登录</button>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <div class="appbar">
      <strong>企微交付助手 · 管理台</strong>
      <div>
        <span id="who" class="sub" style="margin-right:12px"></span>
        <button id="logout-btn" class="secondary" style="width:auto;padding:6px 12px">退出</button>
      </div>
    </div>
    <div class="panel">
      <div class="card">
        <p class="ok">登录成功。骨架已就绪（票 01）。</p>
        <p class="sub">后续：花名册、全局配置、建群流水线、群账务与总账将挂到本壳。</p>
        <p>健康检查：<code id="health">…</code></p>
      </div>
    </div>
  </div>

  <script>
    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginErr = document.getElementById('login-err');
    const who = document.getElementById('who');
    const healthEl = document.getElementById('health');

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || res.statusText);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function refreshMe() {
      try {
        const me = await api('/api/v1/admin/me');
        who.textContent = me.username || '';
        loginView.classList.add('hidden');
        appView.classList.remove('hidden');
        const h = await api('/api/v1/health');
        healthEl.textContent = h.ok ? `ok db=${h.db || 'n/a'}` : JSON.stringify(h);
        return true;
      } catch {
        loginView.classList.remove('hidden');
        appView.classList.add('hidden');
        return false;
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErr.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        await api('/api/v1/admin/login', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });
        await refreshMe();
      } catch (err) {
        loginErr.textContent = err.message || '登录失败';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await api('/api/v1/admin/logout', { method: 'POST' });
      await refreshMe();
    });

    refreshMe();
  </script>
</body>
</html>
